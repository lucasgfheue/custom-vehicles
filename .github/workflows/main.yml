name: Compilar mod (NeoForge 1.21.1)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Gradle (con cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Compilar el mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Subir el .jar del mod
        uses: actions/upload-artifact@v5
        with:
          name: CreatureStudio-NeoForge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
